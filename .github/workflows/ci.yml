# リント、型チェック、テストを実行する。
# Botが台帳(ledger/)に書き込むコミットでは、コードが変わらないので実行しない。
name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "ledger/**"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # package.json の packageManager に書いたバージョンのpnpmを使う
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # 精算のスクリプトが、ビルドせずにNode.jsでそのまま動くことを確かめる
      - run: node scripts/settle.ts --dry-run --month 2000-01
